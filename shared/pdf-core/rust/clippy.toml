allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
msrv = "1.92"
cognitive-complexity-threshold = 25
too-many-lines-threshold = 120
too-many-arguments-threshold = 7
type-complexity-threshold = 250
large-error-threshold = 128
trivial-copy-size-limit = 16
pass-by-value-size-limit = 64
single-char-binding-names-threshold = 8
allowed-idents-below-min-chars = ["a", "b", "c", "d", "e", "f", "x", "y"]
disallowed-methods = [
  { path = "f64::mul_add", reason = "lowers to a libm software call on wasm32 and the x86-64 baseline; write a * b + c" },
  { path = "f64::hypot", reason = "lowers to a libm software call on wasm32 and the x86-64 baseline; write (x * x + y * y).sqrt()" },
  { path = "f64::powi", reason = "lowers to a compiler-rt call on wasm32 and the x86-64 baseline; use a constant table" },
]
