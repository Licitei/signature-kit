[package]
name = "signature-kit-pdf-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "In-house zero-dependency PDF engine compiled to WebAssembly for SignatureKit"
repository = "https://github.com/Licitei/signature-kit"
readme = "../README.md"
keywords = ["pdf", "wasm", "text-extraction"]
categories = ["parser-implementations", "wasm"]
rust-version = "1.92"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
let_underscore_drop = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
unused_macro_rules = "deny"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_docs = "allow"
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
dead_code_pub_in_binary = "deny"
deprecated_in_future = "deny"
deprecated_safe_2024 = "deny"
deref_into_dyn_supertrait = "deny"
edition_2024_expr_fragment_specifier = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
linker_info = "deny"
macro_use_extern_crate = "deny"
missing_unsafe_on_extern = "deny"
raw_borrows_via_references = "deny"
redundant_imports = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
rust_2021_prefixes_incompatible_syntax = "deny"
rust_2021_prelude_collisions = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
tail_expr_drop_order = "deny"
unnameable_types = "deny"
unsafe_attr_outside_unsafe = "deny"
unstable_features = "deny"
unused_crate_dependencies = "deny"
unused_extern_crates = "deny"
unused_results = "allow"
variant_size_differences = "deny"
unfulfilled_lint_expectations = "deny"
unknown_lints = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"
invalid_markdown_table = "deny"
invalid_codeblock_attributes = "deny"
missing_crate_level_docs = "allow"
private_doc_tests = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
integer_division = "deny"
string_slice = "deny"
get_unwrap = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_enum_match_arm = "deny"
shadow_unrelated = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "allow"
self_named_module_files = "deny"
str_to_string = "deny"
format_push_string = "deny"
if_then_some_else_none = "deny"
impl_trait_in_params = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mixed_read_write_in_expression = "deny"
redundant_type_annotations = "deny"
same_name_method = "deny"
try_err = "deny"
unseparated_literal_suffix = "deny"
verbose_file_reads = "deny"
tests_outside_test_module = "deny"
empty_structs_with_brackets = "deny"
empty_enum_variants_with_brackets = "deny"
deref_by_slicing = "deny"
infinite_loop = "deny"
partial_pub_fields = "deny"
ref_patterns = "deny"
renamed_function_params = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
missing_asserts_for_indexing = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
missing_const_for_fn = "deny"
needless_pass_by_value = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
absolute_paths = "allow"
arbitrary_source_item_ordering = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
default_numeric_fallback = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
float_arithmetic = "allow"
host_endian_bytes = "allow"
implicit_return = "allow"
little_endian_bytes = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "allow"
pattern_type_mismatch = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
semicolon_inside_block = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"
decimal_literal_representation = "allow"
non_ascii_literal = "allow"
single_char_lifetime_names = "allow"
integer_division_remainder_used = "allow"
map_with_unused_argument_over_ranges = "allow"
else_if_without_else = "allow"
modulo_arithmetic = "allow"
field_scoped_visibility_modifiers = "allow"
