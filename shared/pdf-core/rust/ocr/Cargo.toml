[package]
name = "signature-kit-pdf-core-ocr"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "In-house zero-dependency OCR engine compiled to WebAssembly for SignatureKit"
repository = "https://github.com/Licitei/signature-kit"
readme = "../../README.md"
keywords = ["ocr", "wasm", "pdf"]
categories = ["computer-vision", "wasm"]
rust-version = "1.92"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[lints]
workspace = true

[features]
ctc-probe = []
ctc-beam = ["ctc-probe"]
ctc-wide = []
ctc-v3 = []
ctc-v4 = ["ctc-probe"]
ocr-lexicon = []
synth = []

[[bin]]
name = "pdf-core-ocr-synth"
path = "src/bin/ocr-synth/main.rs"
required-features = ["synth"]

[[bin]]
name = "pdf-core-ocr-v4"
path = "src/bin/pdf-core-ocr-v4.rs"
required-features = ["ctc-v4"]
