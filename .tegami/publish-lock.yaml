      ---


      ## OpenTelemetry spans for package operations


      The PDF engine and certificate, CMS and crypto packages expose Effect
      spans with operation names, sizes and counts. Span attributes exclude
      document content, certificate identity and secrets.
    filename: opentelemetry-tracing.md
    v: 0.0.0
  - content: >
      ---

      packages:
        "@signature-kit/pdf-core":
          type: patch
      ---


      ## Incremental PDF updates with trailing bytes


      PDF core drops unsigned trailing bytes after the final EOF before
      appending an incremental update. The engine reports damaged
      cross-reference chains through `pdfCore.DAMAGED_XREF`.
    filename: damaged-signed-pdf.md
    v: 0.0.0
  - content: >
      ---

      packages:
        "@signature-kit/pdf-core":
          type: patch
      ---


      ## Column-aware reading order and text flow


      `text` and Markdown now split each page into column regions at prose and
      index gutters before building lines, tables and blocks. Two-column papers
      read the whole left column before the right one, tight 3–4 column layouts
      (gutters of about 1 em) read column by column, and prose columns no longer
      turn into borderless tables. Footnotes at the bottom of a column move to
      the end of the page, superscript footnote markers stay with their text,
      and page continuations skip footnotes, captions and tables. End-of-line
      hyphens are joined with a document-vocabulary rule that keeps real
      compounds.
    filename: pdf-core-reading-order.md
    v: 0.0.0
