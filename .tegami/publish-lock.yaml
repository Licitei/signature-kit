core:changelogs:
  - content: "---\npackages:\n  \"@signature-kit/signatures\":\n    type: minor\n  \"@signature-kit/a1\":\n    type: patch\n  \"@signature-kit/cms\":\n    type: patch\n  \"@signature-kit/certificates\":\n    type: patch\n  \"@signature-kit/http\":\n    type: patch\n  \"@signature-kit/i18n\":\n    type: patch\n  \"@signature-kit/xml\":\n    type: patch\n  \"@signature-kit/asn1\":\n    type: patch\n  \"@signature-kit/crypto\":\n    type: patch\n  \"@signature-kit/assinafy\":\n    type: patch\n  \"@signature-kit/clicksign\":\n    type: patch\n  \"@signature-kit/documenso\":\n    type: patch\n  \"@signature-kit/docuseal\":\n    type: patch\n  \"@signature-kit/zapsign\":\n    type: patch\n---\n\n## Publish the worker signing runtime\n\nPublish `@signature-kit/signatures/session`, which `@signature-kit/react` 0.1.2 imports to sign A1 documents in a Domain RPC worker. Without it, bundlers fail to resolve the react worker entry.\n\nA1 signing makes the WebCrypto sign step uninterruptible. CMS builds the signing-certificate-v2 attribute directly with asn1js. All packages move to Effect 4.1.0 so applications load a single Effect runtime.\n"
    filename: worker-signing-runtime.md
    v: 0.0.0
