name: Set up workspace
description: Installs Bun and dependencies and restores the cached SignatureKit WASM, building it only on a cache miss.

inputs:
  wasm:
    description: Restore signature-kit.wasm from the content-addressed cache so `bun run build` skips the Rust build.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.3

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Compute SignatureKit WASM key
      if: inputs.wasm == 'true'
      id: wasm-key
      shell: bash
      run: |
        echo "key=$(bash crates/wasm/scripts/build-wasm-cached.sh --key)" >> "$GITHUB_OUTPUT"
        echo "SIGNATURE_KIT_WASM_CACHE=$HOME/.cache/signature-kit-wasm" >> "$GITHUB_ENV"

    - name: Restore SignatureKit WASM
      if: inputs.wasm == 'true'
      id: wasm-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/signature-kit-wasm
        key: signature-kit-wasm-${{ steps.wasm-key.outputs.key }}

    - name: Set up Rust for the wasm build
      if: inputs.wasm == 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install the pinned Rust toolchain
      if: inputs.wasm == 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: rustup toolchain install --no-self-update
