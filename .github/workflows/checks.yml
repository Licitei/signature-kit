name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/pdf-core/rust

      - name: Build packages
        run: bun run build

      - name: Run static and type checks
        run: bun run check

      - name: Run non-browser tests
        run: bun run test

      - name: Run server integration tests
        run: bunx nx run @tooling/integration-tests:test:server --outputStyle=static

      - name: Build production site
        run: bun run site:build

      - name: Pack public npm tarballs
        run: bun run pack:npm

      - name: Run local performance tests
        run: bun run test:performance

  kani:
    name: Kani proofs (pdf-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pdf-core harnesses
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          working-directory: shared/pdf-core/rust
          args: "-Z stubbing"
        env:
          RUSTFLAGS: --cap-lints=warn

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/pdf-core/rust

      - name: Build packages
        run: bun run build

      - name: Run browser integration tests
        run: bun run test:integration:browser
