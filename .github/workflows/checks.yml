name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KANI_VERSION: "0.68.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Detect Rust changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          rust=true
          if [[ "$EVENT" == "pull_request" ]]; then
            if files="$(gh api --paginate "repos/$REPO/pulls/$PULL_REQUEST/files" --jq '.[].filename')"; then
              if ! grep -qE '^(shared/pdf-core/(rust|__tests__/fixtures)/|\.github/)' <<<"$files"; then
                rust=false
              fi
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  static:
    name: Static and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: bun run build

      - name: Run static and type checks
        run: bun run check:ts

      - name: Build production site
        run: bun run site:build

      - name: Pack public npm tarballs
        run: bun run pack:npm

  test:
    name: Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: bun run build

      - name: Run non-browser tests
        run: bun run test:unit --shard=${{ matrix.shard }}/2

      - name: Run server integration tests
        if: matrix.shard == 1
        run: bunx nx run @tooling/integration-tests:test:server --outputStyle=static

      - name: Run local performance tests
        if: matrix.shard == 1
        run: bun run test:performance

  browser:
    name: Browser integration (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install Chromium and build packages
        run: |
          bunx playwright install --with-deps chromium &
          chromium=$!
          bun run build
          wait "$chromium"

      - name: Run package browser integration tests
        run: bun run test:integration:browser:packages --shard=${{ matrix.shard }}/2

      - name: Run docs browser integration tests
        run: bun run test:integration:browser:docs --shard=${{ matrix.shard }}/2

  rust:
    name: Rust checks and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          wasm: "false"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/pdf-core/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust static checks
        run: bun run check:rust

      - name: Run Rust tests
        run: bun run test:rust

  kani:
    name: Kani proofs (pdf-core)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo +stable install --locked --version "$KANI_VERSION" kani-verifier
          cargo-kani setup

      - name: Verify pdf-core harnesses
        working-directory: shared/pdf-core/rust
        env:
          RUSTFLAGS: --cap-lints=warn
        run: cargo-kani -Z stubbing

  ci:
    name: CI
    if: always()
    needs: [changes, static, test, browser, rust, kani]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if grep -Eq 'failure|cancelled' <<<"$RESULTS"; then
            exit 1
          fi
