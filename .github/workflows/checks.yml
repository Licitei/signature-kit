name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/pdf-core/rust

      - name: Build packages
        run: bun run build

      - name: Run static and type checks
        run: bun run check

      - name: Run non-browser tests
        run: bun run test

      - name: Run server integration tests
        run: bunx nx run @tooling/integration-tests:test:server --outputStyle=static

      - name: Build production site
        run: bun run site:build

      - name: Pack public npm tarballs
        run: bun run pack:npm

      - name: Run local performance tests
        run: bun run test:performance

  kani:
    name: Kani proofs (pdf-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pdf-core harnesses
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          working-directory: shared/pdf-core/rust
          args: >-
            -Z stubbing --exact
            --harness columns::proofs::column_slots_cover_every_item_and_split_both_sides
            --harness markdown::proofs::glue_only_drops_a_trailing_break_hyphen
            --harness markdown::proofs::page_joins_pair_body_with_body_and_notes_with_notes
            --harness syntax::proofs::object_headers_never_panic
            --harness syntax::proofs::unsigned_numbers_read_every_leading_digit
            --harness syntax::proofs::find_bytes_returns_the_first_match_at_or_after_the_start
            --harness filters::proofs::png_reconstruction_matches_the_png_specification
            --harness filters::proofs::packed_samples_round_trip_and_leave_neighbours_alone
            --harness filters::proofs::ascii_hex_output_respects_its_budget
            --harness filters::proofs::ascii85_full_groups_decode_to_big_endian_words
            --harness inflate::proofs::bit_reader_returns_bits_lsb_first_and_never_overreads
        env:
          RUSTFLAGS: --cap-lints=warn

  browser:
    name: Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shared/pdf-core/rust

      - name: Build packages
        run: bun run build

      - name: Run browser integration tests
        run: bun run test:integration:browser
