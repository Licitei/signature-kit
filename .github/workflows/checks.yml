name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KANI_VERSION: "0.68.0"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Detect Rust changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          rust=true
          if [[ "$EVENT" == "pull_request" ]]; then
            if files="$(gh api --paginate "repos/$REPO/pulls/$PULL_REQUEST/files" --jq '.[].filename')"; then
              if ! grep -qE '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|clippy\.toml$|rustfmt\.toml$|\.github/)' <<<"$files"; then
                rust=false
              fi
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  static:
    name: Static and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: bun run build

      - name: Run static and type checks
        run: bun run check:ts

      - name: Build production site
        run: bun run site:build

      - name: Pack public npm tarballs
        run: bun run pack:npm

  test:
    name: Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: bun run build

      - name: Install independent PDF and CMS validators
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils openssl

      - name: Run non-browser tests
        run: bun run test:unit --shard=${{ matrix.shard }}/2

      - name: Run local performance tests
        if: matrix.shard == 1
        run: bun run test:performance

  browser:
    name: Browser integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [packages, docs]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup

      - name: Install Chromium and build packages
        run: |
          bunx playwright install --with-deps chromium &
          chromium=$!
          bun run build
          wait "$chromium"

      - name: Run browser integration tests
        run: bun run test:integration:browser:${{ matrix.suite }}

  rust:
    name: Rust checks and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          wasm: "false"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust static checks
        run: bun run check:rust

      - name: Run Rust tests
        run: bun run test:rust

  kani:
    name: Kani proofs (pdf-core)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Kani
        id: kani-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}

      - name: Install Kani
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo +stable install --locked --version "$KANI_VERSION" kani-verifier
          for attempt in 1 2 3; do
            cargo-kani setup && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Verify pdf-core harnesses
        working-directory: crates/pdf
        env:
          RUSTFLAGS: --cap-lints=warn
        run: |
          cargo-kani -Z stubbing -j 4 --output-format=terse --exact \
            --harness columns::proofs::column_slots_cover_every_item_and_split_both_sides \
            --harness markdown::proofs::glue_only_drops_a_trailing_break_hyphen \
            --harness markdown::proofs::page_joins_pair_body_with_body_and_notes_with_notes \
            --harness syntax::proofs::object_headers_never_panic \
            --harness syntax::proofs::unsigned_numbers_read_every_leading_digit \
            --harness syntax::proofs::find_bytes_returns_the_first_match_at_or_after_the_start \
            --harness filters::proofs::png_reconstruction_matches_the_png_specification \
            --harness filters::proofs::packed_samples_round_trip_and_leave_neighbours_alone \
            --harness filters::proofs::ascii_hex_output_respects_its_budget \
            --harness filters::proofs::ascii85_full_groups_decode_to_big_endian_words \
            --harness inflate::proofs::bit_reader_returns_bits_lsb_first_and_never_overreads

  ci:
    name: CI
    if: always()
    needs: [changes, static, test, browser, rust, kani]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          if grep -Eq 'failure|cancelled' <<<"$RESULTS"; then
            exit 1
          fi
